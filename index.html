<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101b19">
<title>路亞車牌辨識</title>
<link rel="icon" type="image/png" href="./favicon.png?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=3">
<meta name="apple-mobile-web-app-title" content="路亞車牌辨識">
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;background:#101b19;color:#eef7f2}
*{box-sizing:border-box}body{margin:0;padding:max(12px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}main{max-width:680px;margin:auto}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}h1{font-size:clamp(22px,5vw,30px);margin:0;color:#fff}
button,input{font:inherit}button{cursor:pointer;border:1px solid #587366;border-radius:12px;padding:10px 14px;min-height:44px;background:#243e32;color:#eef7f2}button:disabled{opacity:.55;cursor:default}button:focus-visible{outline:3px solid white;outline-offset:4px}
#settings-toggle{white-space:nowrap}#connection{border:1px solid #365447;border-radius:16px;padding:18px;width:calc(100% - 32px);max-width:480px;max-height:85dvh;overflow:auto;background:#101b19;color:#eef7f2}#connection::backdrop{background:#0009}.dialog-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.dialog-head h2{margin:0;font-size:20px;color:#fff}label{display:block;margin:10px 0 6px}input{width:100%;padding:12px;background:#0b1711;color:white;border:1px solid #587366;border-radius:8px}#check{margin-top:12px}.note{font-size:13px;color:#aec5b9;line-height:1.7}
.preview{position:relative;width:100%;aspect-ratio:19/9;background:#060c0a;border:1px solid #354b42;border-radius:18px;overflow:hidden}video{display:block;width:100%;height:100%;object-fit:cover}
.guide{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:88%;padding:0;border:0;border-radius:10px;min-height:0;background:transparent;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.guide svg{display:block;width:100%;height:auto;overflow:visible;box-shadow:0 0 0 999px #0003;border-radius:10px;pointer-events:none}.guide[aria-disabled="true"]{cursor:wait}.preview[data-busy="true"] .guide rect{stroke:#ffd783}
.camera-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#101b19eb;padding:16px;text-align:center;color:#b5c9c0}
.hint{text-align:center;color:#a9d9c0;font-size:14px;margin:7px 0}.status{padding:9px 12px;border:1px solid #365447;border-radius:12px;line-height:1.65;background:#192b23;overflow-wrap:anywhere}.status[data-kind="error"]{color:#ffe0d6;background:#392622;border-color:#9c6150}
#result{margin-top:10px;padding:14px;border:1px solid #365447;border-radius:16px}h2{font-size:14px;font-weight:500;color:#aec5b9;margin:0 0 8px}#plate{font-size:clamp(32px,9vw,48px);font-weight:750;letter-spacing:.06em;overflow-wrap:anywhere}#database-status:empty{display:none}#database-status{margin:8px 0 0;color:#b5c9c0}#students{list-style:none;padding:0;margin:5px 0 0;line-height:1.5;font-size:clamp(16px,4.5vw,19px)}#students li{padding:8px 0;border-top:1px solid #365447}.student-class{font-size:12px;line-height:1.4;color:#aec5b9;margin-bottom:2px}.student-name{font-size:clamp(21px,5.7vw,25px);line-height:1.5;white-space:nowrap;overflow-x:auto}[hidden]{display:none!important}
</style>
</head><body><main>
<header><h1>路亞車牌辨識</h1><button id="settings-toggle" aria-expanded="false" aria-controls="connection" type="button">⚙ 設定</button></header>
<dialog id="connection" aria-labelledby="connection-title"><div class="dialog-head"><h2 id="connection-title">連線設定</h2><button id="close-settings" type="button" aria-label="關閉設定">關閉</button></div>
<label for="endpoint">電腦連線網址</label><input id="endpoint" type="url" placeholder="https://…trycloudflare.com" autocapitalize="none" spellcheck="false" autocomplete="off">
<label for="key">Connection Key／連線金鑰</label><input id="key" type="password" autocomplete="off" placeholder="貼上電腦顯示的連線金鑰">
<button id="check" type="button">測試連線</button><p id="connection-status" role="status" class="note">尚未測試。</p>
<button id="forget-settings" type="button">清除記住的設定</button><p id="storage-status" class="note" role="status">網址與金鑰會自動記在這支手機的瀏覽器；請使用自己的手機。</p>
<details><summary>最近一次辨識診斷</summary><p id="recognition-diagnostics" class="note" style="white-space:pre-wrap;overflow-wrap:anywhere">尚未辨識</p></details>
<p id="gpu-status" class="note" role="status">GPU 模式尚未確認</p>
</dialog>
<section class="preview" aria-label="相機即時預覽">
<video id="video" autoplay muted playsinline aria-label="相機即時畫面"></video>
<button id="guide" class="guide" type="button" aria-label="點一下綠框辨識車牌；鍵盤可按 Enter 或空白鍵" aria-disabled="true">
<svg viewBox="0 0 380 160" width="380" height="160" aria-hidden="true"><rect x="0" y="0" width="380" height="160" rx="10" fill="none" stroke="#4aee9a" stroke-width="3" vector-effect="non-scaling-stroke"/></svg></button>
<div id="camera-overlay" class="camera-overlay"><span id="camera-label">正在開啟相機…</span><button id="retry" type="button" hidden>點一下開啟相機</button></div>
</section>
<p class="hint">點一下綠框即可辨識</p>
<div id="status" class="status" role="status" aria-live="polite" aria-atomic="true">正在啟動相機…</div>
<section id="result" aria-label="辨識與資料庫查詢結果" aria-live="polite" aria-atomic="true"><h2>車牌辨識結果</h2><div id="plate">—</div><p id="database-status">尚未辨識車牌</p><ul id="students" hidden></ul></section>
<noscript><p>請啟用瀏覽器 JavaScript，才能開啟相機。</p></noscript>
</main><script>
'use strict';
const $ = id => document.getElementById(id);
const video=$('video'), guide=$('guide'), status=$('status');
let stream=null, starting=false, busy=false, requestId=0, generation=0, ocrController=null;
function message(text,kind='info'){status.textContent=text;status.dataset.kind=kind;}
let connectionReady=false, healthGeneration=0, healthController=null;
function openSettings(open){
  const dialog=$('connection');
  if(open && !dialog.open)dialog.showModal();
  if(!open && dialog.open)dialog.close();
  $('settings-toggle').setAttribute('aria-expanded',String(open));
}
$('settings-toggle').addEventListener('click',()=>openSettings(true));
$('close-settings').addEventListener('click',()=>openSettings(false));
$('connection').addEventListener('close',()=>$('settings-toggle').setAttribute('aria-expanded','false'));
function invalidateConnection(){
  connectionReady=false;healthGeneration++;$('gpu-status').textContent='GPU 模式尚未確認';
  if(healthController)healthController.abort();healthController=null;
  $('check').disabled=false;syncGuide();
}
const storageKey='luya-plate-connection-v1';
function saveSettings(){
  try{
    localStorage.setItem(storageKey,JSON.stringify({url:$('endpoint').value.trim(),key:$('key').value.trim()}));
    $('storage-status').textContent='已記住設定，下次使用同一瀏覽器開啟會自動帶入。';
  }catch(_){$('storage-status').textContent='瀏覽器無法儲存設定，本次仍可使用；下次需重新填寫。';}
}
function restoreSettings(){
  try{
    const raw=localStorage.getItem(storageKey);if(!raw)return;
    const saved=JSON.parse(raw);
    if(!saved || typeof saved.url!=='string' || typeof saved.key!=='string')throw new Error('Invalid settings');
    $('endpoint').value=saved.url;$('key').value=saved.key;
    $('storage-status').textContent='已帶入記住的設定；網址若有更換，請更新後測試連線。';
  }catch(_){$('storage-status').textContent='無法讀取記住的設定，請重新填寫。';}
}
for(const id of ['endpoint','key'])$(id).addEventListener('input',()=>{
  invalidateConnection();saveSettings();$('connection-status').textContent='設定已變更，請測試連線。';message('連線尚未測試');
});
$('forget-settings').addEventListener('click',()=>{
  try{
    localStorage.removeItem(storageKey);invalidateConnection();message('請填入連線設定');
    $('endpoint').value='';$('key').value='';
    $('storage-status').textContent='已清除記住的網址與金鑰。';$('connection-status').textContent='尚未設定。';
  }catch(_){$('storage-status').textContent='無法清除，請從瀏覽器的網站設定清除本站資料。';}
});
restoreSettings();
function syncGuide(){guide.setAttribute('aria-disabled',String(busy || !stream || !connectionReady));document.querySelector('.preview').dataset.busy=String(busy);}
  function connectionSettings() {
    const url = new URL(document.getElementById('endpoint').value.trim());
    if (url.protocol !== 'https:' && !(url.protocol === 'http:' && ['127.0.0.1', 'localhost'].includes(url.hostname))) {
      throw new Error('請填入電腦顯示的 HTTPS 連線網址。');
    }
    if (url.username || url.password || url.pathname !== '/' || url.search || url.hash) throw new Error('請只貼上連線網址，不要包含路徑或其他文字。');
    const key = document.getElementById('key').value.trim();
    if (!key) throw new Error('請填入連線金鑰。');
    return { url: url.origin, key };
  }
  async function requestService(path, options = {}) {
    let config;
    try { config = connectionSettings(); }
    catch (e) { throw new Error(e instanceof TypeError ? '請先展開連線設定，填入電腦連線網址。' : e.message); }
    const response = await fetch(config.url + path, {
      ...options, headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + config.key },
      cache: 'no-store', credentials: 'omit', referrerPolicy: 'no-referrer'
    });
    let data;
    try { data = await response.json(); } catch (_) { throw new Error('服務沒有回應，請確認電腦的兩個視窗保持開啟，且網址為本次啟動的網址。'); }
    if (!response.ok) throw new Error((data.error || '服務暫時無法使用。') + '（HTTP ' + response.status + (data.stage ? '／' + data.stage : '') + '）');
    return data;
  }
async function testConnection(){
    if(healthController || busy)return;
      connectionReady=false;$('gpu-status').textContent='GPU 模式尚未確認';syncGuide();
    const id=++healthGeneration;
    const controller=new AbortController();healthController=controller;
    const timeout=setTimeout(()=>controller.abort(),15000);
    $('check').disabled=true;$('connection-status').textContent='正在測試…';message('正在測試連線…');
    try{
      const data=await requestService('/health',{signal:controller.signal});
      if(id!==healthGeneration)return;
      if(!data || data.ok!==true)throw new Error('服務回應不正確，請確認連線網址。');
      const gpu=data.engine && data.engine.providers && data.engine.providers.length===3 && data.engine.providers.every(p=>p==='CUDAExecutionProvider');
      if(!gpu)throw new Error('目前連到 CPU 或舊版服務。請關閉原服務並執行 start_gpu.cmd。');
      $('gpu-status').textContent='NVIDIA GPU 已啟用／原尺寸；三個 OCR 模型均已確認 CUDA。';
      connectionReady=true;saveSettings();
      $('connection-status').textContent='連線測試成功。';
      openSettings(false);
      message(stream && $('camera-overlay').hidden?'已就緒':'連線成功，請開啟相機');
    }catch(e){
      if(id!==healthGeneration)return;
    $('connection-status').textContent=e.name==='AbortError'?'連線逾時，請檢查電腦服務與網址。':e instanceof TypeError?'無法連線，請檢查電腦服務、網路與網址。':e.message;
      message('連線失敗，請重新設定','error');openSettings(true);
    }finally{
      clearTimeout(timeout);
      if(id===healthGeneration){healthController=null;$('check').disabled=false;syncGuide();}
    }
}
$('check').addEventListener('click',testConnection);
  function errorText(error) {
    switch (error.name) {
      case 'NotAllowedError':
      case 'PermissionDeniedError':
        return '無法取得相機權限。請在 Chrome 網址列的網站設定中允許相機；若仍無法開啟，請檢查手機設定中 Chrome 的相機權限，再點相機區重試。';
      case 'NotFoundError':
      case 'DevicesNotFoundError':
        return '找不到可使用的相機。請確認裝置具備相機，並使用手機 Chrome 開啟此網頁。';
      case 'NotReadableError':
      case 'TrackStartError':
        return '相機無法啟動，可能正被其他應用程式使用。請關閉其他使用相機的程式或分頁後重試。';
      case 'OverconstrainedError':
        return '此裝置無法提供符合條件的相機。請改用具備後鏡頭的手機 Chrome 重試。';
      case 'SecurityError':
        return '瀏覽器安全設定禁止使用相機。請直接以 Chrome 開啟 GitHub Pages 的 HTTPS 網址，並檢查網站權限。';
      case 'AbortError':
        return '相機啟動被中斷，請點相機區重試。';
      default:
        return '無法開啟相機（' + (error.name || '未知錯誤') + '）。請重新整理頁面，或關閉其他相機程式後重試。';
    }
  }

  function cropBounds(sourceWidth, sourceHeight, viewport, guide) {
    const scale = Math.max(viewport.width / sourceWidth, viewport.height / sourceHeight);
    const offsetX = (sourceWidth * scale - viewport.width) / 2;
    const offsetY = (sourceHeight * scale - viewport.height) / 2;
    const x = Math.max(0, (guide.left - viewport.left + offsetX) / scale);
    const y = Math.max(0, (guide.top - viewport.top + offsetY) / scale);
    return { x, y, width: Math.min(guide.width / scale, sourceWidth - x), height: Math.min(guide.height / scale, sourceHeight - y) };
  }


// Keep original crop pixels unless PNG would exceed the existing server limits.
function encodeCrop(source,bounds,canvas){
  let scale=Math.min(1,Math.sqrt(11000000/(bounds.width*bounds.height)));
  for(let attempt=0;attempt<12;attempt++){
    canvas.width=Math.max(1,Math.floor(bounds.width*scale));canvas.height=Math.max(1,Math.floor(bounds.height*scale));
    const context=canvas.getContext('2d');if(!context)throw new Error('無法擷取相機畫面，請重新整理後再試。');
    context.drawImage(source,bounds.x,bounds.y,bounds.width,bounds.height,0,0,canvas.width,canvas.height);
    const image=canvas.toDataURL('image/png');
    if(!image.startsWith('data:image/png;base64,'))throw new Error('無法產生照片，請重試。');
    if(image.length<7.5*1024*1024)return {image,reduced:scale<1};
    scale*=0.85;
  }
  throw new Error('照片太大，請重試。');
}
function releaseCamera(){
  requestId++; starting=false;
  if(stream) stream.getTracks().forEach(track=>track.stop());
  stream=null;video.srcObject=null;syncGuide();
  $('camera-overlay').hidden=false;$('camera-label').textContent='相機尚未開啟';$('retry').hidden=false;
}
async function startCamera(){
  if(starting || stream) return;
  if(!window.isSecureContext){releaseCamera();message('相機需要安全連線。請使用 GitHub Pages 的 HTTPS 網址開啟此頁面。','error');return;}
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){releaseCamera();message('此瀏覽器無法使用相機功能。請改用手機 Chrome，並確認瀏覽器已更新。','error');return;}
  const id=++requestId;starting=true;$('retry').hidden=true;$('camera-label').textContent='正在開啟相機…';
  message('正在啟動相機；若出現權限提示，請選擇允許。');
  try{
    const acquired=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:3840},height:{ideal:2160}}});
    if(id!==requestId){acquired.getTracks().forEach(t=>t.stop());return;}
    stream=acquired;video.srcObject=acquired;
    const track=acquired.getVideoTracks()[0];
    track.addEventListener('ended',()=>{if(stream!==acquired)return;releaseCamera();message('相機已中斷或權限已被撤回。請確認權限後點相機區重試。','error');});
    await video.play();if(id!==requestId)return;
    $('camera-overlay').hidden=true;syncGuide();
    await testConnection();
  }catch(error){if(id!==requestId)return;releaseCamera();message(errorText(error),'error');}
  finally{if(id===requestId)starting=false;}
}
$('retry').addEventListener('click',startCamera);

function renderDatabase(data){
  const list=$('students');list.replaceChildren();list.hidden=true;
  if(data.status==='found' && Array.isArray(data.students) && data.students.length){
    $('database-status').textContent='';
    for(const student of data.students){
      const item=document.createElement('li');
      if(student.className){const classroom=document.createElement('div');classroom.className='student-class';classroom.textContent=String(student.className).trim();item.appendChild(classroom);}
      const name=document.createElement('div');name.className='student-name';name.textContent=[student.name,student.englishName].filter(Boolean).join(' ').replace(/[\s\u3000]+/g,' ').trim();item.appendChild(name);
      list.appendChild(item);
    }list.hidden=false;
  }else if(data.status==='not_found'){$('database-status').textContent='查無此車牌，請確認車牌或重新辨識。';}
  else if(data.status==='error'){$('database-status').textContent=data.message || '無法讀取學生名單';}
  else{$('database-status').textContent='請更新電腦端 server.py，才能查詢學生名單。';}
}
async function captureAndRecognize(){
  if(busy || healthController)return;
  if(!connectionReady){openSettings(true);message('請先測試連線');return;}
  if(!stream || video.readyState<2 || !video.videoWidth || !video.videoHeight){message('相機畫面尚未準備好，請稍候再試。','error');return;}
  try{connectionSettings();}catch(e){openSettings(true);message(e instanceof TypeError?'請在設定填入有效的電腦連線網址。':e.message,'error');return;}
  busy=true;syncGuide();const id=++generation;
  $('plate').textContent='—';$('students').replaceChildren();$('students').hidden=true;$('database-status').textContent='等待車牌辨識';message('辨識中…');
  const controller=new AbortController();ocrController=controller;
  const timeout=setTimeout(()=>controller.abort(),45000);
  const started=performance.now();let phase='擷取照片',captureSeconds=0;
  $('recognition-diagnostics').textContent='辨識中…';
  let canvas=null, image=null, captureInfo='';
  try{
    const bounds=cropBounds(video.videoWidth,video.videoHeight,video.getBoundingClientRect(),guide.querySelector('svg').getBoundingClientRect());
    if(bounds.width<=0 || bounds.height<=0)throw new Error('無法擷取照片，請確認相機畫面正常後重試。');
    canvas=document.createElement('canvas');
    const encoded=encodeCrop(video,bounds,canvas);image=encoded.image;
    captureInfo='相機：'+video.videoWidth+' × '+video.videoHeight+'；上傳：'+canvas.width+' × '+canvas.height+(encoded.reduced?'（為符合上傳限制已縮小）':'');
    captureSeconds=(performance.now()-started)/1000;phase='上傳或等待電腦回應';
    const data=await requestService('/recognize',{method:'POST',body:JSON.stringify({image}),signal:controller.signal});
    clearTimeout(timeout);image=null;canvas.width=canvas.height=0;
    if(id!==generation)return;
    const plate=typeof data.plate==='string'?data.plate.trim():'';
    const d=data.diagnostics || {},t=d.timings || {};
    const fmt=x=>typeof x==='number' && Number.isFinite(x)?x.toFixed(2)+' 秒':'未提供';
    const reason={recognized:'已讀出車牌',no_text:'OCR 沒有讀出文字',invalid_plate_format:'OCR 讀到文字，但不符合車牌格式'};
    $('recognition-diagnostics').textContent=[reason[d.reason] || (plate?'已讀出車牌':'舊版後端未提供原因'), '模式：'+(d.mode || '未提供'), captureInfo, '總耗時：'+fmt((performance.now()-started)/1000), '手機擷取：'+fmt(captureSeconds), '接收上傳：'+fmt(t.receive), '圖片解碼：'+fmt(t.decode), 'OCR 辨識：'+fmt(t.ocr), '名單查詢：'+fmt(t.lookup), 'OCR 原始文字：'+(Array.isArray(d.ocr_text)?d.ocr_text.join(' / '):'未提供')].join('\n');
    if(!plate){message('辨識不成功，請重試','error');$('database-status').textContent='';return;}
    $('plate').textContent=plate;message('車牌辨識成功，請核對號碼。');
    renderDatabase(data.lookup || {status:'unavailable'});
  }catch(e){
    if(id!==generation)return;
    message('辨識不成功，請重試','error');
    $('recognition-diagnostics').textContent='失敗階段：'+phase+'\n總耗時：'+((performance.now()-started)/1000).toFixed(2)+' 秒\n'+(e.name==='AbortError'?'等待超過 45 秒':e instanceof TypeError?'網路連線失敗，未收到可用結果':e.message);
    $('connection-status').textContent=e.name==='AbortError'?'辨識逾時，請確認電腦連線後重試。':e instanceof TypeError?'無法連線，請檢查電腦服務與連線設定。':e.message;
    $('database-status').textContent='';
  }finally{
    clearTimeout(timeout);image=null;if(canvas)canvas.width=canvas.height=0;
    if(id===generation){ocrController=null;busy=false;syncGuide();}
  }
}
// Native button click supports a single touch, mouse click, and keyboard activation.
guide.addEventListener('click',captureAndRecognize);
window.addEventListener('pagehide',()=>{invalidateConnection();generation++;if(ocrController)ocrController.abort();ocrController=null;busy=false;releaseCamera();});
window.addEventListener('pageshow',e=>{if(e.persisted)startCamera();});
startCamera();
</script></body></html>
